# Docker activates this profile. Cloud credentials are required, with no localhost fallback.
server:
  address: 0.0.0.0
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      # Free instances have limited CPU and may connect across regions; allow TLS/authentication to finish.
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      data-source-properties:
        sslMode: VERIFY_IDENTITY
        connectTimeout: 15000
        socketTimeout: 30000
  sql:
    init:
      mode: never
