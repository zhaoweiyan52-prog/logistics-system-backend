server:
  port: ${PORT:${SERVER_PORT:8080}}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logistics?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:logistics_app}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
app:
  token-hours: 8
  cors-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}
